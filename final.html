.bar { background:#1a1a1a; height:12px; margin-top:8px; }

.ai-box { background:#020a1a; border:1px solid #00d4ff; padding:12px; font-size:19px; font-weight:bold; }
button { width:100%; background:#ff2a2a; color:white; border:none; padding:14px; margin-top:9px; font-size:15px; font-weight:bold; }
